let f=[Math.cos(k.a),Math.sin(k.a)],r=[-f[1],f[0]];
let vf=k.vx*f[0]+k.vy*f[1],vl=k.vx*r[0]+k.vy*r[1];
if(racing&&sh&&!k.drift&&vf>140&&Math.abs(s)>.3){k.drift=Math.sign(s);k.driftT=0;vl-=k.drift*70;k.a+=k.drift*.08}
if(k.drift&&(!sh||vf<90||!racing)){if(k.driftT>1&&k.boostT<.4){k.boostT=.4;if(k.isP)say('드리프트 탈출!')}k.drift=0}
const base=2.7*Math.min(1,Math.abs(vf)/100)/(1+Math.abs(vf)/600)*(vf>=0?1:-1);
let da=k.steer*base;if(k.drift)da=(k.drift*.9+k.steer*.8)*base*1.2;
k.a+=da*dt;
f=[Math.cos(k.a),Math.sin(k.a)];r=[-f[1],f[0]];
vf=k.vx*f[0]+k.vy*f[1];vl=k.vx*r[0]+k.vy*r[1];
const grip=k.drift?1.4:10,vl2=vl*Math.exp(-grip*dt);vf+=Math.abs(vl-vl2)*(k.drift?.35:.85)*(vf>=0?1:-1);vl=vl2;
k.lock=Math.max(0,k.lock-dt);k.shiftT=Math.max(0,k.shiftT-dt);
const thr=up&&k.lock<=0;k.thr=thr;
let rpm=Math.max(900,Math.abs(vf)*RAT[k.gear]*14);
if(k.shiftT<=0){if(rpm>6600&&k.gear<4){k.gear++;k.shiftT=.18}else if(rpm<2800&&k.gear>0){k.gear--;k.shiftT=.12}}
rpm=Math.max(900,Math.abs(vf)*RAT[k.gear]*14);if(thr&&vf<60)rpm=Math.max(rpm,3200);
const tq=rpm>7000?.1:.55+.45*Math.sin(Math.PI*cl((rpm-1000)/5800,0,1));
k.rpm+=(rpm-k.rpm)*Math.min(1,dt*12);
if(thr&&k.shiftT<=0&&vf>-20)vf+=150*RAT[k.gear]*tq*dt*k.pw;
if(dn){if(vf>5)vf-=550*dt;else vf=Math.max(-120,vf-220*dt)}
if(k.boostT>0){k.boostT-=dt;vf+=480*dt;vf=Math.min(vf,700)}
vf-=Math.sign(vf)*(.00055*vf*vf+30)*dt*(k.boostT>0?.5:1);
if(k.drift)vf*=Math.exp(-.1*dt);
if(dead){const q=Math.exp(-1.8*dt);vf*=q;vl*=q}
if(k.drift){k.driftT+=dt;const slip=Math.abs(vl)/(Math.abs(vf)+1);k.gauge+=dt*(.2+slip*1.4)*(vf>150?1:.3);
if(k.gauge>=1){if(k.stock<2){k.stock++;k.gauge=0;if(k.isP)say('부스터 충전!')}else k.gauge=1}}
k.vx=f[0]*vf+r[0]*vl;k.vy=f[1]*vf+r[1]*vl;
const b=near(k.x,k.y,k.idx);
if(b.d>HW){const q=Math.exp(-1.7*dt);k.vx*=q;k.vy*=q;if(b.d>HW+5&&Math.hypot(k.vx,k.vy)>230){const m=230/Math.hypot(k.vx,k.vy);k.vx*=m;k.vy*=m}}
if(b.d>HW+70){const nx=(k.x-b.px)/b.d,ny=(k.y-b.py)/b.d;k.x=b.px+nx*(HW+70);k.y=b.py+ny*(HW+70);const vn=k.vx*nx+k.vy*ny;if(vn>0){k.vx-=1.5*vn*nx;k.vy-=1.5*vn*ny}k.drift=0}
k.x+=k.vx*dt;k.y+=k.vy*dt;
if(racing){const pv=k.idx;k.idx=b.i;if(b.i>N*.4&&b.i<N*.6)k.half=true;
if(b.i<N*.15&&pv>N*.85&&k.half){if(k.isP){const lt=tm-k.lapStart;lapTimes.push(lt);if(best===null||lt<best)best=lt}k.lapStart=tm;k.half=false;k.lap++;
if(k.lap>LAPS){if(!k.fin){k.fin=true;k.finT=tm}if(k.isP)st='finish'}else if(k.isP)say('LAP '+k.lap)}}
else k.idx=b.i;
k.sp=Math.hypot(k.vx,k.vy);k.vl=vl;
if(k.drift||Math.abs(vl)>90)for(const sd of[-1,1])addSk(k.x-f[0]*14+r[0]*10*sd,k.y-f[1]*14+r[1]*10*sd);
}
function step(dt){
if(msgT>0)msgT-=dt;if(flashT>0)flashT-=dt;
if(st=='count'){cd-=dt;if(cd<=0){st='race';tm=0;if(K('ArrowUp','KeyW')){if(pressT!==null&&pressT<=.6){P.boostT=1.2;say('START BOOST!')}else{P.lock=.8;say('휠 스핀!')}}if(Math.random()<.5)A.boostT=1}}
else if(st=='race')tm+=dt;
if(st=='finish')return;
PIN.up=K('ArrowUp','KeyW');PIN.dn=K('ArrowDown','KeyS');PIN.s=(K('ArrowRight','KeyD')?1:0)-(K('ArrowLeft','KeyA')?1:0);PIN.sh=K('ShiftLeft','ShiftRight');
aiInput(A,AIN,dt);drive(P,PIN,dt);drive(A,AIN,dt);items(dt);
camA+=wa(P.a-camA)*Math.min(1,dt*5);
if(gn){gn.gain.value=.03+(P.thr?.03:0)+(P.boostT>0?.02:0);osc.frequency.value=35+P.rpm*.04}
}
// ---- 3D 갱신 ----
function place(k,G,B,F,S,dt){G.position.set(k.x,0,k.y);G.rotation.y=-k.a;
k.byaw+=(-k.drift*.22-k.byaw)*Math.min(1,dt*8);B.rotation.y=k.byaw+(k.spinT>0?k.spinA:0);
B.rotation.x=-k.steer*Math.min(1,k.sp/500)*.12-k.drift*.05;
F.visible=k.boostT>0;F.scale.set(.8+Math.random()*.6,1,1);
const gc=k.gauge>.66?0xff8c1a:k.gauge>.33?0xffdd44:0x66ccff;S.forEach(m=>{m.visible=!!k.drift;m.material.color.setHex(gc);m.scale.setScalar(.6+Math.random()*1.2)})}
function render3d(dt){
place(P,kg,body,fl,sp,dt);place(A,kg2,body2,fl2,sp2,dt);
const fx=Math.cos(camA),fz=Math.sin(camA),sh=P.boostT>0?(Math.random()-.5)*1.2:0,sp0=P.sp;let tf;cam.up.set(0,1,0);
if(VW==0){const d=108+(P.boostT>0?22:0)+sp0*.02;cam.position.set(P.x-fx*d,46+sh+sp0*.012,P.y-fz*d);cam.lookAt(P.x+fx*70,12,P.y+fz*70);tf=66+22*Math.min(1,sp0/700)+(P.boostT>0?10:0)}
else if(VW==1){const d=260+sp0*.05;cam.position.set(P.x-fx*d,150+sh,P.y-fz*d);cam.lookAt(P.x+fx*90,10,P.y+fz*90);tf=58+16*Math.min(1,sp0/700)+(P.boostT>0?8:0)}
else if(VW==2){const hx=Math.cos(P.a),hz=Math.sin(P.a);cam.position.set(P.x+hx*3,34+sh*.3,P.y+hz*3);cam.lookAt(P.x+hx*220,22,P.y+hz*220);tf=80+20*Math.min(1,sp0/700)+(P.boostT>0?12:0)}
else{cam.position.set(P.x,560+sp0*.4,P.y);cam.up.set(fx,0,fz);cam.lookAt(P.x+fx*80,0,P.y+fz*80);tf=50}
fov+=(tf-fov)*Math.min(1,dt*4);cam.fov=fov;cam.updateProjectionMatrix();
R.render(scene,cam)}
// ---- HUD ----
const fmt=t=>t==null?'--:--.--':Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0');
function hud(){
g.clearRect(0,0,W,H);g.textBaseline='alphabetic';g.fillStyle='#fff';g.font='bold 15px system-ui';g.textAlign='left';
g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=4;
g.fillText('LAP '+Math.min(k.lap,LAPS)+'/'+LAPS,16,28);g.fillText('TIME '+fmt(tm),16,50);g.fillText('BEST '+fmt(best),16,72);
g.font='12px system-ui';g.fillStyle='#fff';g.fillText('↑가속 ↓브레이크 ←→조향 Shift드리프트 Space부스터 Ctrl/X아이템 C시점 R재시작',16,H-14);
const kmh=Math.round(k.sp*0.45);g.textAlign='right';g.fillStyle='#fff';g.font='bold 44px system-ui';g.fillText(kmh,W-86,H-70);g.font='13px system-ui';g.fillText('km/h',W-30,H-70);
g.shadowBlur=0;
const bx=W-250,by=H-52,bw=220;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(bx,by,bw,12);const rr=cl((k.rpm-900)/6600,0,1);g.fillStyle=rr>.85?'#f44':rr>.6?'#fd4':'#4d8';g.fillRect(bx,by,bw*rr,12);
g.fillStyle='#fff';g.font='bold 14px system-ui';g.textAlign='left';g.fillText('GEAR '+(k.sp<3&&k.thr?'N':k.gear+1),bx,by-6);g.textAlign='right';g.fillText(Math.round(k.rpm)+' rpm',bx+bw,by-6);
const gw=260,gx=W/2-gw/2,gy=H-48;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(gx,gy,gw,12);g.fillStyle=k.drift?'#6cf':'#48a';g.fillRect(gx,gy,gw*k.gauge,12);
for(let i=0;i<2;i++){g.fillStyle=i<k.stock?'#4af':'rgba(0,0,0,.6)';g.fillRect(gx+gw/2-34+i*40,gy-22,30,12)}
g.fillStyle='#fff';g.font='11px system-ui';g.textAlign='center';g.fillText('DRIFT GAUGE',gx+gw/2,gy+26);
{const mw=130,ms=mw/Math.max(mxx-mnx,mxy-mny),ox=W-mw-20,oy=20;g.save();g.translate(ox,oy);g.scale(ms,ms);g.translate(-mnx,-mny);g.lineWidth=8/ms;g.strokeStyle='rgba(255,255,255,.7)';g.stroke(path);g.fillStyle='#f84';g.beginPath();g.arc(k.x,k.y,9/ms,0,7);g.fill();g.restore()}
g.textAlign='center';
if(st=='count'){g.font='bold 90px system-ui';g.fillStyle='#fff';g.fillText(Math.ceil(cd),W/2,H*0.3);g.font='14px system-ui';g.fillText('GO 직전 0.6초 안에 ↑ 를 눌러 스타트 부스터!',W/2,H*0.3+34)}
else if(msgT>0&&st=='race'){g.font='bold 34px system-ui';g.fillStyle='#fd4';g.fillText(msg,W/2,H*0.25)}
if(st=='finish'){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='bold 44px system-ui';g.fillText('FINISH!',W/2,H/2-70);g.font='20px system-ui';lapTimes.forEach((t,i)=>g.fillText('LAP '+(i+1)+'  '+fmt(t),W/2,H/2-20+i*30));g.fillText('TOTAL '+fmt(tm),W/2,H/2+80);g.font='15px system-ui';g.fillText('R 키로 재시작',W/2,H/2+115)}
}
const IC={boost:['🚀','부스터'],banana:['🍌','바나나'],missile:['🎯','미사일'],shield:['🛡️','실드'],bomb:['💦','물폭탄'],thunder:['⚡','번개']},ICK=Object.keys(IC);
function hud2(){
const rk=st=='finish'?(A.fin?2:1):(prog(P)>prog(A)?1:2);
g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=4;g.textAlign='left';g.font='bold 40px system-ui';g.fillStyle=rk==1?'#fd4':'#fff';g.fillText(rk+'/2',16,118);
g.font='12px system-ui';g.fillStyle='#fff';g.fillText('시점: '+VN[VW]+' (C)   상대: 배찌(AI)',16,138);g.shadowBlur=0;

if(ic){g.font='36px system-ui';g.fillStyle='#fff';g.fillText(IC[ic][0],W/2,sy+46);if(P.itemT<=0){g.font='11px system-ui';g.fillText(IC[ic][1]+' (Ctrl/X)',W/2,sy+68)}}
else{g.font='11px system-ui';g.fillStyle='#aab';g.fillText('아이템 없음',W/2,sy+44)}
{const mw=130,ms=mw/Math.max(mxx-mnx,mxy-mny),ox=W-mw-20,oy=20;g.fillStyle='#e33';g.beginPath();g.arc(ox+(A.x-mnx)*ms,oy+(A.y-mny)*ms,4.5,0,7);g.fill()}
if(P.shieldT>0){g.font='13px system-ui';g.fillStyle='#6df';g.fillText('🛡️ 실드 '+P.shieldT.toFixed(1)+'s',W/2,sy+100)}
if(flashT>0){g.fillStyle='rgba(255,255,255,'+Math.min(1,flashT*2)+')';g.fillRect(0,0,W,H)}

}
let last=performance.now();
(function loop(n){const dt=Math.min(1/30,(n-last)/1000);last=n;step(dt);render3d(dt);hud();hud2();requestAnimationFrame(loop)})(last);
